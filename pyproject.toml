[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fyrefly"
version = "0.1.0"
description = "Simple, flexible functions to add, multiply, and divide any count of numbers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" }
]
keywords = ["math", "arithmetic", "quant", "utility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/yourusername/fyrefly"
Repository = "https://github.com/yourusername/fyrefly"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
